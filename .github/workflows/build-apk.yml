name: Build FMHY Vault APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17 for Gradle & Capacitor
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Generate Custom App Icons & AMOLED Splash Screens
        run: |
          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png assets/icon-only.png
            cp assets/icon.png assets/icon-foreground.png
            cp assets/icon.png assets/splash.png
            cp assets/icon.png assets/splash-dark.png
            npx --yes @capacitor/assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'
          fi

      - name: Sync www/ assets into Android project
        run: npx cap sync android

      - name: Configure Pitch-Black AMOLED Launch Theme & Internet Permissions
        run: |
          chmod +x android/gradlew
          sed -i 's/android:allowBackup="true"/android:allowBackup="true" android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml

      - name: Compile Debug APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Rename APK for easy download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FMHY-Vault.apk

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FMHY-Vault-APK
          path: FMHY-Vault.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "FMHY Vault (Latest Build)"
          body: "Automated AMOLED Android build synced with fmhy/edit."
          files: FMHY-Vault.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
